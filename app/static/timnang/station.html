<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trạm — Tìm Nắng</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b1020; color: #fff;
    font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; user-select: none; }
  #stage { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; padding: 20px; }
  #teamBadge { font-size: clamp(28px, 5vw, 52px); font-weight: 900; padding: 8px 36px; border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  #objectBox { font-size: clamp(24px, 4vw, 44px); font-weight: 700; text-align: center;
    background: rgba(0,0,0,.4); padding: 14px 32px; border-radius: 18px; min-height: 72px;
    display: flex; align-items: center; justify-content: center; gap: 12px; transition: all .3s; }
  #objectBox.live { border: 3px solid #ffd700; box-shadow: 0 0 30px rgba(255,215,0,.4); }
  #camWrap { position: relative; width: min(90vw, 75vh); aspect-ratio: 4/3; border-radius: 24px; overflow: hidden;
    background: #000; box-shadow: 0 12px 40px rgba(0,0,0,.5); border: 4px solid var(--team, #fff); }
  #cam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }  /* mirror */
  #recBtn { font-size: clamp(24px, 4vw, 40px); font-weight: 800; padding: 22px 60px; border: none; border-radius: 60px;
    cursor: pointer; background: linear-gradient(135deg, #ffd700, #ff9800); color: #3a2a00;
    box-shadow: 0 10px 36px rgba(255,152,0,.45); transition: transform .1s; }
  #recBtn:hover:not(:disabled) { transform: scale(1.05); }
  #recBtn:active:not(:disabled) { transform: scale(.96); }
  #recBtn:disabled { opacity: .5; cursor: wait; }
  #result { font-size: clamp(20px, 3vw, 32px); font-weight: 700; min-height: 48px; text-align: center; transition: all .3s; }
  #result.ok { color: #2ecc71; text-shadow: 0 0 20px rgba(46,204,113,.5); }
  #result.bad { color: #ff6b6b; }
  #result.wait { color: #ffd700; }
  #score { position: absolute; top: 18px; right: 22px; font-size: clamp(20px, 3vw, 32px); font-weight: 800;
    background: rgba(0,0,0,.4); padding: 8px 22px; border-radius: 14px; }
  #phaseTag { position: absolute; top: 18px; left: 22px; font-size: 13px; opacity: .7; background: rgba(0,0,0,.4);
    padding: 6px 14px; border-radius: 10px; }
  #confetti { position: absolute; inset: 0; pointer-events: none; z-index: 10; }

  /* ============ THINKING MODAL POPUP ============ */
  .thinking-overlay { position: fixed; inset: 0; z-index: 9990; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
  .thinking-overlay.show { display: flex; opacity: 1; }
  .thinking-card { background: rgba(20, 30, 55, 0.95); border: 3px solid #ffd700; border-radius: 24px; padding: 24px 44px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,0.6); animation: pulseCard 1.5s infinite alternate ease-in-out; }
  @keyframes pulseCard { 0% { transform: scale(0.97); } 100% { transform: scale(1.03); } }
  .thinking-spinner { font-size: 54px; animation: bounceEmoji 0.9s infinite alternate; }
  @keyframes bounceEmoji { 0% { transform: translateY(0); } 100% { transform: translateY(-10px); } }
  .thinking-text { font-size: 26px; font-weight: 800; color: #ffd700; margin-top: 10px; text-shadow: 0 2px 10px rgba(255,215,0,0.4); }
</style>
</head>
<body>
<div id="stage">
  <div id="phaseTag">Trạm — Tìm Nắng</div>
  <div id="teamBadge">Đội ?</div>
  <div id="objectBox">⏳ Đợi vòng bắt đầu...</div>
  <div id="camWrap"><video id="cam" autoplay playsinline muted></video></div>
  <button id="recBtn">🔍 NHẬN DIỆN</button>
  <div id="result"> </div>
  <div id="score">Điểm: 0</div>
  <canvas id="confetti"></canvas>
</div>
<canvas id="snap" hidden></canvas>

<!-- THINKING MODAL POPUP -->
<div id="thinkingModal" class="thinking-overlay">
  <div class="thinking-card">
    <div class="thinking-spinner">🤖</div>
    <div class="thinking-text" id="thinkingMsg">AI đang nhận diện...</div>
  </div>
</div>

<script>
const TEAM_COLORS = { A: '#e74c3c', B: '#3498db', C: '#2ecc71', D: '#f1c40f', E: '#9b59b6' };
const TEAM_NAMES  = { A: 'Đội A',  B: 'Đội B',  C: 'Đội C',  D: 'Đội D',  E: 'Đội E' };
const team = location.pathname.split('/').pop().toUpperCase();
const teamColor = TEAM_COLORS[team] || '#fff';

document.getElementById('teamBadge').textContent = TEAM_NAMES[team] || ('Đội ' + team);
document.getElementById('teamBadge').style.background = teamColor;
document.getElementById('teamBadge').style.color = '#fff';
document.documentElement.style.setProperty('--team', teamColor);

const cam = document.getElementById('cam');
const snap = document.getElementById('snap');
const recBtn = document.getElementById('recBtn');
const resultEl = document.getElementById('result');
const objectBox = document.getElementById('objectBox');
const scoreEl = document.getElementById('score');

// ---- Webcam ----
navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 640 } }, audio: false })
  .then(s => { cam.srcObject = s; })
  .catch(e => { resultEl.className = 'bad'; resultEl.textContent = '⚠️ Không mở được camera: ' + e.message; recBtn.disabled = true; });

// ---- Toast & WebSocket ----
let ws = null;
let wsRetryTimer = null;

function showToast(msg, isErr = false) {
  let t = document.getElementById('netToast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'netToast';
    t.style.cssText = 'position:fixed;top:16px;right:16px;z-index:9999;padding:10px 18px;border-radius:10px;font-weight:bold;font-size:14px;box-shadow:0 4px 15px rgba(0,0,0,0.3);transition:opacity 0.3s;pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.background = isErr ? '#e74c3c' : '#2ecc71';
  t.style.color = '#fff';
  t.style.opacity = '1';
  if (!isErr) {
    setTimeout(() => { if (t) t.style.opacity = '0'; }, 3000);
  }
}

function sendWS(data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(typeof data === 'string' ? data : JSON.stringify(data));
  }
}

function showThinking(msg = 'AI đang nhận diện...') {
  const m = document.getElementById('thinkingModal');
  const t = document.getElementById('thinkingMsg');
  if (t) t.textContent = msg;
  if (m) m.classList.add('show');
}

function hideThinking() {
  const m = document.getElementById('thinkingModal');
  if (m) m.classList.remove('show');
}

function initWS() {
  const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${protocol}://${location.host}/ws/station/${team}`);

  ws.onopen = () => {
    showToast(`⚡ Trạm ${team} đã kết nối máy chủ`);
    if (wsRetryTimer) { clearTimeout(wsRetryTimer); wsRetryTimer = null; }
  };

  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    switch (m.type) {
      case 'round':
        hideThinking();
        const iconStr = m.icon ? (m.icon + ' ') : '🎯 ';
        objectBox.textContent = iconStr + 'Hãy tìm: ' + m.object;
        objectBox.classList.add('live');
        resultEl.textContent = ' '; resultEl.className = '';
        break;
      case 'scoreboard':
        document.getElementById('phaseTag').textContent = `Trạm ${team} · vòng ${m.round}/${m.rounds} · ${m.phase}`;
        const me = m.teams.find(t => t.id === team);
        if (me) scoreEl.textContent = 'Điểm: ' + me.score;
        break;
      case 'result':
        hideThinking();
        recBtn.disabled = false;
        resultEl.textContent = m.msg || '';
        if (m.correct === true) { resultEl.className = 'ok'; playChime('correct'); burstConfetti(teamColor); }
        else if (m.correct === false) { resultEl.className = 'bad'; playChime('wrong'); }
        else { resultEl.className = 'wait'; }
        break;
      case 'reset':
        hideThinking();
        objectBox.textContent = '⏳ Đợi vòng bắt đầu...'; objectBox.classList.remove('live');
        resultEl.textContent = ' '; resultEl.className = '';
        clearConfetti();
        break;
      case 'game_over':
        hideThinking();
        objectBox.textContent = '🏁 Trò chơi kết thúc!';
        if (m.winner === team) { resultEl.className = 'ok'; resultEl.textContent = '🏆 Đội mình VÔ ĐỊCH!'; burstConfetti(teamColor, 120); }
        break;
    }
  };

  ws.onclose = ws.onerror = () => {
    showToast(`⚠️ Trạm ${team} mất kết nối! Đang kết nối lại...`, true);
    if (!wsRetryTimer) {
      wsRetryTimer = setTimeout(() => {
        wsRetryTimer = null;
        initWS();
      }, 2000);
    }
  };
}
initWS();

// ---- Grab frame + send ----
function recognize() {
  if (!cam.videoWidth) { resultEl.className = 'bad'; resultEl.textContent = 'Camera chưa sẵn sàng'; return; }
  const w = 480, h = Math.round(480 * cam.videoHeight / cam.videoWidth);
  snap.width = w; snap.height = h;
  const ctx = snap.getContext('2d');
  ctx.save(); ctx.scale(-1, 1); ctx.translate(-w, 0); ctx.drawImage(cam, 0, 0, w, h); ctx.restore();  // un-mirror
  const img = snap.toDataURL('image/jpeg', 0.7);
  resultEl.className = 'wait'; resultEl.textContent = '🤖 Đang nhận diện...';
  recBtn.disabled = true;
  showThinking('🤖 AI đang phân tích hình ảnh...');
  sendWS({ type: 'recognize', image: img });
}
recBtn.addEventListener('click', recognize);
// Phím Space hoặc Enter cũng nhận diện
document.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !recBtn.disabled) { e.preventDefault(); recognize(); } });

// ---- Chime (Web Audio) ----
let actx = null;
function playChime(kind) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const now = actx.currentTime;
    const notes = kind === 'correct' ? [523, 659, 784] : [330, 220];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.25, now + i * 0.12);
      g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.3);
      o.connect(g).connect(actx.destination); o.start(now + i * 0.12); o.stop(now + i * 0.12 + 0.3);
    });
  } catch (e) {}
}

// ---- Confetti ----
const cc = document.getElementById('confetti');
const cctx = cc.getContext('2d');
let pieces = [], running = false;
function resizeCC() { cc.width = window.innerWidth; cc.height = window.innerHeight; }
window.addEventListener('resize', resizeCC); resizeCC();
function burstConfetti(color, n = 60) {
  for (let i = 0; i < n; i++) {
    pieces.push({ x: window.innerWidth/2 + (Math.random()-.5)*200, y: window.innerHeight*.3,
      vx: (Math.random()-.5)*12, vy: -Math.random()*14-3, w: 5+Math.random()*8, h: 5+Math.random()*8,
      color: Math.random()<.5 ? color : '#ffd700', rot: Math.random()*360, rotV: (Math.random()-.5)*8,
      life: 1, decay: 0.004+Math.random()*0.008 });
  }
  if (!running) { running = true; renderCC(); }
}
function clearConfetti() { pieces = []; cctx.clearRect(0,0,cc.width,cc.height); }
function renderCC() {
  cctx.clearRect(0,0,cc.width,cc.height);
  pieces = pieces.filter(p => p.life > 0);
  for (const p of pieces) {
    p.x += p.vx; p.vy += 0.22; p.y += p.vy; p.rot += p.rotV; p.life -= p.decay;
    cctx.save(); cctx.translate(p.x, p.y); cctx.rotate(p.rot*Math.PI/180);
    cctx.globalAlpha = Math.max(0, p.life); cctx.fillStyle = p.color;
    cctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); cctx.restore();
  }
  if (pieces.length) requestAnimationFrame(renderCC); else running = false;
}
</script>
</body>
</html>
